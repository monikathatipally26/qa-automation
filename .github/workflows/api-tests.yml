name: FoodDiary API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Run API Tests
        run: |
          cd selenium
          mvn test -Dtest=USDAApiTest
      
      - name: Generate Allure Report
        if: always()
        run: |
          cd selenium
          mvn allure:report
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: selenium/target/site/allure-maven-plugin